# Options affecting the basic behavior of iDisguise (including the developer API)
disguise:
   
   # Blacklist of disguise types:
   # Default ones are unsupported, add any one if you would like to disable it
   disguise-type-blacklist: 
   - ARROW
   - BLOCK_DISPLAY
   - BREEZE_WIND_CHARGE
   - COMPLEX_PART
   - DRAGON_FIREBALL
   - EGG
   - ENDER_CRYSTAL
   - END_CRYSTAL
   - ENDER_DRAGON
   - ENDER_PEARL
   - ENDER_SIGNAL
   - EVOKER_FANGS
   - EXPERIENCE_ORB
   - EXPERIENCE_BOTTLE
   - EYE_OF_ENDER
   - FALLING_BLOCK
   - FIREBALL
   - FIREWORK
   - FIREWORK_ROCKET
   - FISHING_BOBBER
   - FISHING_HOOK
   - GLOW_ITEM_FRAME
   - INTERACTION
   - ITEM_DISPLAY
   - ITEM_FRAME
   - LEASH_HITCH
   - LEASH_KNOT
   - LIGHTNING
   - LIGHTNING_BOLT
   - LINGERING_POTION
   - LLAMA_SPIT
   - MANNEQUIN
   - MARKER
   - MINECART_CHEST
   - CHEST_MINECART
   - MINECART_COMMAND
   - COMMAND_BLOCK_MINECART
   - MINECART_FURNACE
   - FURNACE_MINECART
   - MINECART_HOPPER
   - HOPPER_MINECART
   - MINECART_MOB_SPAWNER
   - SPAWNER_MINECART
   - MINECART_TNT
   - TNT_MINECART
   - OMINOUS_ITEM_SPAWNER
   - PAINTING
   - PRIMED_TNT
   - SHULKER_BULLET
   - SMALL_FIREBALL
   - SNOWBALL
   - SPECTRAL_ARROW
   - SPLASH_POTION
   - TEXT_DISPLAY
   - THROWN_EXP_BOTTLE
   - TIPPED_ARROW
   - TRIDENT
   - UNKNOWN
   - WEATHER
   - WIND_CHARGE
   - WITHER_SKULL

   # Blacklist of player disguises:
   # Add any player name if you would like to disable it
   player-disguise-blacklist: 
   - put player name here

   # Are player disguises visible to the disguised players themselves in 3rd person view?
   # if true: a dummy world 'iDisguiseDummyWorld' is created, which is necessary to realize this feature. 
   player-disguise-viewself: true
   
# Options affecting the commands and permissions of iDisguise (these do NOT affect the developer API)
commands:

   # Whitelist of statements to alter the disguises:
   # add/remove any one if you would like to enable/disable it
   statement-whitelist: 
   - setCustomName
   - setGlowing
   - setFireTicks
   - setFreezeTicks
   - setSilent
   - setAdult
   - setBaby
   - setVariant
   - setPlayingDead
   - setHasNectar
   - setCatType
   - setCollarColor
   - setCarryingChest
   - setFoxType
   - setSleeping
   - setLeftHorn
   - setRightHorn
   - setColor
   - setStyle
   - setMainGene
   - setOnBack
   - setRolling
   - setSneezing
   - setDisplayBlock
   - setDisplayBlockData
   - setRabbitType
   - setState
   - setSaddle
   - setShivering
   - setAngry
   - setSkeletonType
   - setBoatType
   - setAwake
   - setProfession
   - setVillagerType
   - setSize
   - setPuffState
   - setVillager
   - setItemStack
   - setSitting
   - setCarriedBlock
   - setCarriedMaterial
   - setSheared
   - setBodyColor
   - setPattern
   - setPatternColor
   - setVillagerProfession
   - setPowered

   # Do we use permission nodes?
   # if true: require permission node 'iDisguise.disguise.<ENTITYTYPE>' or 'iDisguise.disguise.*' to disguise
   # if false: only server operators can disguise
   use-permission-nodes: false

# Options affecting the update checking feature
updates:
   
   # Check whether an update is available at every server start
   check: true
   
   # Automatically download new updates
   download: false

# For internal purposes only
version: iDisguise 6.0.4
