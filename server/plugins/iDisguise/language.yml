help-page-title: §2===== §liDisguise§r§2 Help Page %number% =====
help-disguise-mob: '§6§lDisguise as a mob: §o/disguise <entity-type>\\§6Example: §o/disguise
  zombie\\§6Use [TAB] to get a list of all entity types.\\§6After disguising, you
  will be able to see your own disguise\\§6for five seconds.'
help-disguise-player: '§6§lDisguise as a player: §o/disguise player <name>\\§6Example:
  §o/disguise player Notch\\§6You can always see your own player disguise.'
help-disguise-player-2: '§6§lDisguise as a player: §o/disguise player <name>\\§6Example:
  §o/disguise player Notch\\§6You can''t see your own player disguise.'
help-disguise-check: '§6§lCheck your disguise: §o/disguise\\§6You will be able to
  see your own disguise for another five\\§6seconds.'
help-undisguise: '§6§lUndisguise: §o/undisguise'
help-disguise-alter: '§6§lAlter your disguise: §o/disguise <type> <statement> ...\\§6Example:
  §o/disguise horse setColor(WHITE) setBaby()\\§6Use [TAB] after entering the entity
  type to get a list of all\\§6possible statements.'
help-ingame-help: '§6§lIn-game help: §o/disguise ? [page]'
help-disguise-permission: §6By default, only server operators can use the commands.\\§6If you enable §ocommands.use-permission-nodes§r§6 in the\\§6§oconfig.yml§r§6, disguising requires the permission node\\§6§liDisguise.disguise.<entity-type>\\§6(e.g., §oiDisguise.disguise.SNOW_GOLEM§r§6 for the snow golem)\\§6or the wildcard §liDisguise.disguise.*
help-odisguise: '§6§lDisguise another player: §o/odisguise <player>\\§6§l§o<entity-type>'
help-undisguise-other: '§6§lUndisguise another player: §o/undisguise <player>'
help-odisguise-info: §6Player disguise and statements work as well.
help-ingame-help-2: '§6§lIn-game help: §o/odisguise ? [page]'
help-odisguise-permission: §6By default, only server operators can use these commands.\\§6If you enable §ocommands.use-permission-nodes§r§6 in the\\§6§oconfig.yml§r§6, these commands require the permission node\\§6§liDisguise.others§r§6 AND the respective disguise-specific\\§6permission node.
